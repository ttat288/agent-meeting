name: Đề xuất tính năng / Feature request
description: Ý tưởng để Foxul tốt hơn
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề bạn gặp
      description: Bạn đang cố làm gì và điều gì cản trở?
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Giải pháp đề xuất
  - type: textarea
    id: alternatives
    attributes:
      label: Cách khác bạn đã cân nhắc
