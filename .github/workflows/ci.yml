name: CI
on: [push, pull_request]
# A branch push and its PR update share one validation lane. Keep repository
# identity in the key so equally named branches from forks stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    # Ubuntu 22.04 supports the unprivileged namespaces required by bubblewrap.
    # No host sysctl or sandbox fallback is used.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - name: Prepare filesystem sandbox
        run: |
          bash .github/scripts/install-ubuntu-test-tools.sh bubblewrap desktop-file-utils libglib2.0-bin
          node -e "require('./src/execution-sandbox').checkSandbox()"
      - name: Test sequentially with memory and time limits
        shell: bash
        run: |
          node_bin="$(command -v node)"
          sudo systemd-run --scope -q -p MemoryMax=1200M -p MemorySwapMax=0 \
            sudo -u "$(id -un)" env "PATH=$PATH" timeout 900 "$node_bin" scripts/test.js
