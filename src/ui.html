<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Meeting</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171a;--mute:#667085;--line:#e4e7ec;--accent:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef0f4}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a1f;--ink:#e8eaed;--mute:#98a2b3;--line:#262b33;--accent:#818cf8;--chip:#222730}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;flex:none}
h1{font-size:17px;margin:0;font-weight:650}
.pill{padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--mute)}
.pill.live{background:#16a34a22;color:var(--ok)}.pill.ended{background:#dc262622;color:var(--bad)}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:650}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:130px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.sec{background:var(--chip);color:var(--ink)}button.bad{background:var(--bad)}button.sm{padding:4px 10px;font-size:12.5px}
.big{padding:12px 22px;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.dot.listening{background:var(--ok);box-shadow:0 0 0 3px #16a34a2e}
.dot.thinking{background:var(--warn);box-shadow:0 0 0 3px #d977062e;animation:p 1.2s infinite}
.dot.left,.dot.ended{background:var(--line)}
@keyframes p{50%{opacity:.4}}
.cap{font-size:12.5px;color:var(--mute);margin-top:8px}

/* Màn 1: chuẩn bị */
#setupView{flex:1;overflow:auto;padding:20px 16px}
.wrap{max-width:760px;margin:0 auto}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.slot.empty{border-style:dashed;color:var(--mute);background:transparent}
.slot small{color:var(--mute);margin-left:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:5px 12px;border-radius:99px;background:var(--chip);color:var(--mute);font-size:13px}
.tab.on{background:var(--accent);color:#fff}
pre{margin:6px 0 8px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:220px;overflow:auto}

.startbar{position:sticky;bottom:-20px;display:flex;align-items:center;gap:14px;padding:12px 0 20px;margin-bottom:-20px;background:var(--bg);border-top:1px solid var(--line)}
.startbar .cap{margin:0;flex:1;min-width:180px}

/* Màn 2: cuộc họp, toàn màn hình */
#meetView{flex:1;min-height:0;display:flex;flex-direction:column}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:13.5px}
.chip small{color:var(--mute)}
#feed{flex:1;min-height:0;overflow:auto;padding:20px 16px}
#feedInner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 15px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.msg b{display:block;font-size:12.5px;margin-bottom:2px}
.msg.host{align-self:stretch;max-width:100%;border-color:var(--accent)}
.sys{align-self:center;font-size:12.5px;color:var(--mute);background:var(--chip);padding:2px 12px;border-radius:99px}
#foot{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;border-top:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mute)}
#typing{color:var(--warn);flex:1;min-height:20px}
.bar{width:140px;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
@media(max-width:640px){.startbar .cap{display:none}.startbar button{flex:1}#count{display:none}header button{padding:6px 10px;font-size:13px}h1{font-size:15px}#foot{flex-wrap:wrap;padding:10px 16px}#typing{flex-basis:100%}.msg{max-width:100%}header{padding:10px 16px}#chips{padding:8px 16px}}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 30px #0004;padding:16px;overflow:auto;z-index:20}
</style>
</head>
<body>
<header>
  <h1>🤝 Agent Meeting</h1>
  <span class="pill" id="pill">Đang kết nối…</span>
  <span class="pill" id="count">0 agent</span>
  <span class="grow"></span>
  <button class="sec" id="inviteBtn" hidden>＋ Mời thêm agent</button>
  <button class="bad" id="stopBtn" hidden>Kết thúc cuộc họp</button>
</header>

<!-- Màn 1: chuẩn bị -->
<div id="setupView"><div class="wrap">
  <div class="card">
    <h2>1 · Bối cảnh cuộc họp</h2>
    <label for="ctx">Bối cảnh / chủ đề họp</label>
    <textarea id="ctx" placeholder="Ví dụ: Hai bạn hãy thống nhất kiến trúc cho app todo: chọn DB, cách auth, và chia việc."></textarea>
    <label for="endc">Điều kiện kết thúc (tuỳ chọn)</label>
    <input id="endc" placeholder="Để trống: các agent tự bàn đến khi chốt rồi tự rời phòng">
  </div>
  <div class="card" id="inviteHome">
    <div id="invite">
      <h2>2 · Mời agent vào họp</h2>
      <div class="tabs" id="tabs"></div>
      <div id="tabBody"></div>
      <p class="cap">Link chứa mã bí mật: ai có link đều vào họp được. Đừng chia sẻ công khai.</p>
    </div>
  </div>
  <div class="card">
    <h2>Agent đã vào · <span id="slotCount">0</span></h2>
    <div class="slots" id="slots"></div>
  </div>
  <div class="startbar">
    <button class="big" id="startBtn">▶ Bắt đầu cuộc họp</button>
    <span class="cap">Có thể bắt đầu khi chưa đủ agent; ai vào sau vẫn đọc được từ đầu.</span>
  </div>
</div></div>

<!-- Màn 2: cuộc họp toàn màn hình -->
<div id="meetView" hidden>
  <div id="chips"></div>
  <div id="feed"><div id="feedInner"></div></div>
  <div id="foot">
    <span id="typing"></span>
    <span><span id="msgCount">0</span>/<span id="msgMax">0</span> tin</span>
    <div class="bar"><i id="barFill" style="width:0"></i></div>
    <button class="sec sm" id="copyLog">Sao chép biên bản</button>
    <button class="sec sm" id="dlLog">Tải biên bản .md</button>
  </div>
</div>
<div id="drawer" hidden>
  <div class="row" style="display:flex;justify-content:flex-end"><button class="sec sm" id="closeDrawer">Đóng ✕</button></div>
  <div class="card" id="drawerCard"></div>
</div>

<script>
const key = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
const COLORS = ['#4f46e5','#0891b2','#c026d3','#ea580c','#16a34a','#db2777','#7c3aed','#0d9488'];
const colorOf = (name) => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const STATUS = { listening: 'đang nghe', thinking: 'đang soạn tin…', idle: 'có mặt', left: 'đã rời', ended: 'đã kết thúc' };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let inviteBuilt = false, version = -1, last = null;

function copy(text, btn, label) {
  const done = () => { btn.textContent = 'Đã chép ✓'; setTimeout(() => btn.textContent = label, 1400); };
  const fallback = () => { const a = document.createElement('textarea'); a.value = text; document.body.append(a); a.select(); try { document.execCommand('copy'); } catch {} a.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function block(title, text, primary) {
  const wrap = document.createElement('div');
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = title;
  const pre = document.createElement('pre'); pre.textContent = text;
  const label = primary ? '📋 Sao chép prompt này' : 'Sao chép';
  const b = document.createElement('button'); b.className = primary ? '' : 'sec sm'; b.textContent = label;
  b.onclick = () => copy(text, b, label);
  wrap.append(cap, pre, b); return wrap;
}
function buildInvite(agentId) {
  const o = location.origin, mcp = `${o}/mcp/${agentId}`, base = `${o}/a/${agentId}`;
  const curlSteps = `Chạy lệnh sau (đổi TÊN thành tên ngắn của bạn, ví dụ GPT):\ncurl -s -X POST "${base}/join" --data-urlencode "name=TÊN"\nRồi làm đúng giao thức nó trả về (vòng lặp nghe/nói bằng curl) cho đến khi cuộc họp kết thúc.`;
  const curlPrompt = `Hãy tham gia một cuộc họp nhiều agent. ${curlSteps}`;
  const combined = (cmd) => `Hãy tham gia một cuộc họp nhiều agent.

Cách 1 (MCP): chạy lệnh shell sau để cài MCP "agent-meeting":
${cmd}
Nếu công cụ của bạn cần mở lại phiên để nạp MCP thì báo tôi mở lại, rồi gọi join(name="<tên ngắn của bạn, ví dụ Claude>"), làm đúng giao thức nó trả về và lặp wait/say cho đến khi cuộc họp kết thúc.

Cách 2 (dùng ngay, không cần cài, nếu MCP chưa dùng được): ${curlSteps}`;
  const mcpTab = (cmd) => [['Dán thẳng cho agent: nó tự cài MCP rồi vào họp (có đường lui bằng curl):', combined(cmd), true], ['Hoặc tự cài thủ công rồi mở lại phiên:', cmd]];
  const tabs = {
    'Dán là vào ngay': [['Dùng được với mọi agent chạy được shell/curl, không cần cài hay mở lại phiên. Dán thẳng cho agent:', curlPrompt, true]],
    'Claude Code': mcpTab(`claude mcp add --transport http agent-meeting ${mcp}`),
    'Codex CLI': mcpTab(`codex mcp add agent-meeting --url ${mcp}`),
    'Gemini CLI': mcpTab(`gemini mcp add --transport http agent-meeting ${mcp}`),
  };
  const tabsEl = $('tabs'), body = $('tabBody');
  Object.entries(tabs).forEach(([name, blocks], i) => {
    const t = document.createElement('button'); t.className = 'tab' + (i ? '' : ' on'); t.textContent = name;
    const show = () => { [...tabsEl.children].forEach(c => c.classList.toggle('on', c === t)); body.replaceChildren(...blocks.map(([a, b, p]) => block(a, b, p))); };
    t.onclick = show; tabsEl.append(t); if (!i) show();
  });
}

function render(s) {
  last = s;
  if (!inviteBuilt) { buildInvite(s.agentId); inviteBuilt = true; }
  const lobby = s.state === 'LOBBY';
  $('setupView').hidden = !lobby; $('meetView').hidden = lobby;
  $('stopBtn').hidden = s.state !== 'LIVE'; $('inviteBtn').hidden = s.state !== 'LIVE';
  const pill = $('pill');
  pill.className = 'pill ' + (s.state === 'LIVE' ? 'live' : s.state === 'ENDED' ? 'ended' : '');
  pill.textContent = lobby ? 'Chờ bắt đầu' : s.state === 'LIVE' ? '● Đang họp' : 'Đã kết thúc' + (s.endReason ? ' · ' + s.endReason : '');
  $('count').textContent = s.agents.filter(a => a.status !== 'left' && a.status !== 'ended').length + ' agent trong phòng';

  // Màn 1: danh sách slot, tăng dần khi agent vào
  $('slotCount').textContent = s.agents.length;
  const slots = $('slots'); slots.replaceChildren();
  s.agents.forEach(a => {
    const el = document.createElement('div'); el.className = 'slot';
    const d = document.createElement('span'); d.className = 'dot ' + a.status;
    const n = document.createElement('b'); n.textContent = a.name; n.style.color = colorOf(a.name);
    const st = document.createElement('small'); st.textContent = `slot ${a.slot} · ${STATUS[a.status]}`;
    el.append(d, n, st); slots.append(el);
  });
  const e = document.createElement('div'); e.className = 'slot empty';
  e.textContent = `Slot ${s.agents.length + 1} · đang chờ agent vào…`; slots.append(e);

  if (lobby) return;
  // Màn 2: chip agent + toàn bộ cuộc họp
  const chips = $('chips'); chips.replaceChildren();
  s.agents.forEach(a => {
    const el = document.createElement('div'); el.className = 'chip';
    const d = document.createElement('span'); d.className = 'dot ' + a.status;
    const n = document.createElement('b'); n.textContent = a.name; n.style.color = colorOf(a.name);
    const st = document.createElement('small'); st.textContent = `slot ${a.slot} · ${STATUS[a.status]}`;
    el.append(d, n, st); chips.append(el);
  });
  $('msgCount').textContent = s.chatCount; $('msgMax').textContent = s.max;
  $('barFill').style.width = Math.min(100, s.chatCount / s.max * 100) + '%';
  const feed = $('feed'), inner = $('feedInner'), stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 60;
  inner.replaceChildren();
  s.log.forEach(m => {
    const el = document.createElement('div');
    if (m.type === 'sys') { el.className = 'sys'; el.textContent = m.text; }
    else {
      el.className = 'msg' + (m.type === 'host' ? ' host' : '');
      const b = document.createElement('b'); b.textContent = m.type === 'host' ? 'Chủ trì' : m.name; b.style.color = m.type === 'host' ? 'var(--accent)' : colorOf(m.name);
      el.append(b, document.createTextNode(m.text));
    }
    inner.append(el);
  });
  if (stick) feed.scrollTop = feed.scrollHeight;
  const th = s.agents.filter(a => a.status === 'thinking').map(a => a.name);
  $('typing').textContent = th.length ? `✎ ${th.join(', ')} đang soạn tin…` : '';
}

$('startBtn').onclick = () => fetch(`/api/host/${key}/start`, { method: 'POST', body: JSON.stringify({ context: $('ctx').value, endCondition: $('endc').value }) });
$('stopBtn').onclick = () => { if (confirm('Kết thúc cuộc họp ngay? Các agent sẽ được báo dừng.')) fetch(`/api/host/${key}/stop`, { method: 'POST' }); };
// Biên bản cuộc họp dạng Markdown
function minutes(s) {
  const time = (t) => new Date(t).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const lines = [`# Biên bản cuộc họp agent`, '', `- Ngày: ${new Date().toLocaleString('vi-VN')}`,
    `- Thành viên: ${s.agents.map(a => `${a.name} (slot ${a.slot})`).join(', ') || '(không có)'}`,
    `- Trạng thái: ${s.state === 'ENDED' ? 'đã kết thúc' + (s.endReason ? ' · ' + s.endReason : '') : 'đang họp'}`, ''];
  for (const m of s.log) {
    if (m.type === 'sys') lines.push(`*${time(m.t)} · ${m.text}*`, '');
    else lines.push(`**${m.type === 'host' ? 'Chủ trì' : m.name}** · ${time(m.t)}`, '', m.text, '');
  }
  return lines.join('\n');
}
$('copyLog').onclick = () => last && copy(minutes(last), $('copyLog'), 'Sao chép biên bản');
$('dlLog').onclick = () => {
  if (!last) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([minutes(last)], { type: 'text/markdown' }));
  a.download = `bien-ban-hop-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.md`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// Mời thêm agent khi đang họp: chuyển khung mời vào ngăn kéo bên phải
$('inviteBtn').onclick = () => { $('drawerCard').append($('invite')); $('drawer').hidden = false; };
$('closeDrawer').onclick = () => { $('drawer').hidden = true; $('inviteHome').append($('invite')); };

// Long-poll: server giữ yêu cầu tới khi có thay đổi (tunnel Cloudflare miễn phí không hỗ trợ SSE)
(async function loop() {
  for (;;) {
    try {
      const r = await fetch(`/api/host/${key}/state?v=${version}`);
      if (!r.ok) throw new Error(r.status);
      const s = await r.json(); version = s.version; render(s);
    } catch { $('pill').className = 'pill'; $('pill').textContent = 'Mất kết nối server…'; await sleep(2000); }
  }
})();
</script>
</body>
</html>
